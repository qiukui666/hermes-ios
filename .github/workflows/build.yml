name: Build Hermes iOS ipa (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build renderer (vite)
        working-directory: mobile/desktop-port
        run: ./build.sh

      - name: Install app deps and sync
        working-directory: mobile
        run: |
          npm install
          npx cap sync ios

      - name: Prepare unsigned xcconfig (no team, ad-hoc style)
        working-directory: mobile/ios
        run: |
          cat > App/Unsigned.xcconfig <<'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGN_IDENTITY =
          DEVELOPMENT_TEAM =
          PRODUCT_BUNDLE_IDENTIFIER = com.qiukui.hermes.mobile
          EOF
          # 让项目吃到 Unsigned.xcconfig
          sed -i '' 's|// Set.*||' App/App.xcconfig 2>/dev/null || true
          cat App/Unsigned.xcconfig >> App/App.xcconfig

      - name: Pod install
        working-directory: mobile/ios/App
        run: pod install

      - name: Archive (unsigned)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build archive -archivePath build/Hermes.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Export unsigned ipa
        working-directory: mobile/ios/App
        run: |
          mkdir -p Payload
          cp -R build/Hermes.xcarchive/Products/Applications/*.app Payload/
          zip -r Hermes-iOS-unsigned.ipa Payload -x "*.DS_Store"
          ls -la Hermes-iOS-unsigned.ipa

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ios-ipa
          path: mobile/ios/App/Hermes-iOS-unsigned.ipa
          retention-days: 30
