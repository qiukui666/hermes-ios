name: Build Hermes iOS ipa (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build renderer (vite)
        working-directory: mobile/desktop-port
        run: ./build.sh

      - name: Downgrade CSS for iOS 16.4 WebKit (oklch/color-mix -> rgb)
        working-directory: mobile/desktop-port
        run: |
          cd scripts
          npm init -y >/dev/null
          npm install lightningcss culori --no-audit --no-fund
          for f in ../dist/assets/*.css; do
            echo "processing $f"
            node down.js "$f" "$f.tmp" && mv "$f.tmp" "$f"
            node varfix.js "$f" "$f.tmp" && mv "$f.tmp" "$f"
          done
          echo "oklch remaining: $(grep -o 'oklch(' ../dist/assets/*.css | wc -l | tr -d ' ')"

      - name: Install app deps and sync
        working-directory: mobile
        run: |
          npm install
          npx cap sync ios

      - name: Ad-hoc sign all binaries with ldid
        working-directory: mobile/ios/App
        run: |
          brew install ldid
          ARCHIVE=build/Hermes.xcarchive
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build archive -archivePath $ARCHIVE CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tail -5
          APP_PATH=$(ls -d $ARCHIVE/Products/Applications/*.app | head -1)
          ldid -S "$APP_PATH/App"
          for fw in "$APP_PATH"/Frameworks/*.framework/*; do
            [ -f "$fw" ] && file "$fw" | grep -q Mach-O && ldid -S "$fw"
          done
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Hermes-iOS.ipa Payload
          ls -la Hermes-iOS.ipa

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ios-ipa
          path: mobile/ios/App/Hermes-iOS.ipa
          retention-days: 30
